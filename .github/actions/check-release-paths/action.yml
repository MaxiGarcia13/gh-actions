name: Check release paths
description: Decide whether to bump based on files changed in commits within a git revision range

inputs:
  range:
    description: Git revision range (for example v1.0.0..HEAD or HEAD). Files are collected from every commit in the range.
    required: true
  paths:
    description: Newline-separated globs; bump only if at least one changed file matches
    required: false
    default: ""
  paths_ignore:
    description: Newline-separated globs; skip bump when every changed file matches
    required: false
    default: ""

outputs:
  should_bump:
    description: Whether changed files satisfy the path filters
    value: ${{ steps.check.outputs.should_bump }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      run: |
        set -euo pipefail

        echo "Release range: ${RANGE}"

        should_bump="$(python3 - <<'PY'
        import fnmatch
        import os
        import re
        import subprocess
        import sys

        range_ref = os.environ["RANGE"]
        paths_include = os.environ.get("PATHS", "").strip()
        paths_ignore = os.environ.get("PATHS_IGNORE", "").strip()

        def normalize_pattern(pattern: str) -> str:
            pattern = pattern.strip()
            if len(pattern) >= 2 and pattern[0] == pattern[-1] and pattern[0] in "\"'":
                pattern = pattern[1:-1].strip()
            return pattern.lstrip("./")

        include_patterns = [
            normalize_pattern(pattern)
            for pattern in paths_include.splitlines()
            if normalize_pattern(pattern)
        ]
        ignore_patterns = [
            normalize_pattern(pattern)
            for pattern in paths_ignore.splitlines()
            if normalize_pattern(pattern)
        ]

        print(f"Include patterns: {include_patterns or '(none)'}", file=sys.stderr)
        print(f"Ignore patterns: {ignore_patterns or '(none)'}", file=sys.stderr)

        if not include_patterns and not ignore_patterns:
            print("true")
            sys.exit(0)

        result = subprocess.run(
            ["git", "log", range_ref, "--name-only", "--pretty=format:"],
            capture_output=True,
            text=True,
            check=True,
        )
        files = sorted({line for line in result.stdout.splitlines() if line.strip()})

        print(f"Changed files since range ({len(files)}):", file=sys.stderr)
        for path in files:
            print(f"  - {path}", file=sys.stderr)

        if not files:
            print("No changed files in range; skipping bump.", file=sys.stderr)
            print("false")
            sys.exit(0)

        def glob_to_regex(pattern: str) -> re.Pattern[str]:
            parts: list[str] = []
            index = 0
            while index < len(pattern):
                if pattern[index : index + 2] == "**":
                    parts.append(".*")
                    index += 2
                elif pattern[index] == "*":
                    parts.append("[^/]*")
                    index += 1
                elif pattern[index] == "?":
                    parts.append("[^/]")
                    index += 1
                else:
                    parts.append(re.escape(pattern[index]))
                    index += 1
            return re.compile(f"^{''.join(parts)}$")

        def matches(path: str, pattern: str) -> bool:
            candidates = {pattern}
            if not pattern.startswith("**/"):
                candidates.add(f"**/{pattern}")

            if any(glob_to_regex(candidate).match(path) for candidate in candidates):
                return True

            if fnmatch.fnmatch(path, pattern):
                return True

            basename = path.rsplit("/", 1)[-1]
            if "**/" in pattern:
                suffix = pattern.split("**/", 1)[1]
                if fnmatch.fnmatch(path, suffix) or fnmatch.fnmatch(basename, suffix):
                    return True

            return False

        def matches_any(path: str, patterns: list[str]) -> bool:
            return any(matches(path, pattern) for pattern in patterns)

        should_bump = True

        if include_patterns:
            matched_files = [path for path in files if matches_any(path, include_patterns)]
            should_bump = bool(matched_files)
            print(
                f"Include matches ({len(matched_files)}): {matched_files or '(none)'}",
                file=sys.stderr,
            )

        if should_bump and ignore_patterns:
            should_bump = not all(matches_any(path, ignore_patterns) for path in files)

        print(f"should_bump={should_bump}", file=sys.stderr)
        print(str(should_bump).lower())
        PY
        )"

        echo "should_bump=$should_bump" >> "$GITHUB_OUTPUT"
      env:
        RANGE: ${{ inputs.range }}
        PATHS: ${{ inputs.paths }}
        PATHS_IGNORE: ${{ inputs.paths_ignore }}
