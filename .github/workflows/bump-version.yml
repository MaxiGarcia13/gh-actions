name: Bump version

on:
  workflow_call:
    inputs:
      default_branch:
        description: Branch to push the version bump and tags to
        type: string
        required: false
        default: main
      node_version:
        description: Node.js version for setup-node
        type: string
        required: false
        default: "24"
      working_directory:
        description: Directory containing package.json (use . for repo root)
        type: string
        required: false
        default: "."
      paths:
        description: Newline-separated globs; bump only if at least one changed file since the last tag matches
        type: string
        required: false
        default: ""
      paths_ignore:
        description: Newline-separated globs; skip bump when every changed file since the last tag matches
        type: string
        required: false
        default: ""
    outputs:
      tag:
        description: Release tag created by the bump (for example v1.2.3)
        value: ${{ jobs.bump.outputs.tag }}

permissions:
  contents: write

concurrency:
  group: bump-version-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory || '.' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release range
        id: range
        uses: ./.github/actions/resolve-release-range

      - name: Decide bump (minor if any feat:, else patch)
        id: bump
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          range="${{ steps.range.outputs.range }}"
          subjects="$(git log "$range" --format=%s || true)"

          bump="minor"
          if echo "$subjects" | grep -Eq '^(fix)(\(.+\))?!?:'; then
            bump="patch"
          fi

          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Check changed paths
        id: paths
        uses: ./.github/actions/check-release-paths
        with:
          range: ${{ steps.range.outputs.range }}
          paths: ${{ inputs.paths }}
          paths_ignore: ${{ inputs.paths_ignore }}

      - name: Skip bump (no relevant path changes)
        if: steps.paths.outputs.should_bump != 'true'
        run: echo "Skipping bump; changed files do not match path filters."

      - name: Setup Node
        if: steps.paths.outputs.should_bump == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ (inputs.working_directory || '.') == '.' && 'package-lock.json' || format('{0}/package-lock.json', inputs.working_directory || '.') }}

      - name: Configure git author
        if: steps.paths.outputs.should_bump == 'true'
        uses: MaxiGarcia13/gh-actions/.github/actions/configure-git-author@main

      - name: Install dependencies
        if: steps.paths.outputs.should_bump == 'true'
        run: npm ci

      - name: Bump version, commit, and tag
        if: steps.paths.outputs.should_bump == 'true'
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          set -euo pipefail
          npm version "$BUMP" -m "chore(release): v%s"

      - name: Read release tag
        if: steps.paths.outputs.should_bump == 'true'
        id: release_tag
        uses: MaxiGarcia13/gh-actions/.github/actions/read-release-tag@main
        with:
          working_directory: ${{ inputs.working_directory || '.' }}

      - name: Push commit and tags
        if: steps.paths.outputs.should_bump == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git push origin "HEAD:${{ inputs.default_branch }}" --follow-tags
